name: Update SkillSprout Client

on:
  repository_dispatch:
    types: [skillsprout-client-updated]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write
  packages: read

concurrency:
  group: "update-skillsprout"
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          cache: 'npm'

      - name: Check current version
        id: current
        run: |
          CURRENT=$(node -e "const p=require('./package-lock.json'); console.log(p.packages['node_modules/@zaherkarp/skillsprout-client']?.version||'unknown')")
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update package
        run: npm update @zaherkarp/skillsprout-client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check new version
        id: updated
        run: |
          NEW=$(node -e "const p=require('./package-lock.json'); console.log(p.packages['node_modules/@zaherkarp/skillsprout-client']?.version||'unknown')")
          echo "version=$NEW" >> $GITHUB_OUTPUT

      - name: Build verification
        if: steps.current.outputs.version != steps.updated.outputs.version
        run: npm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        if: steps.current.outputs.version != steps.updated.outputs.version
        # Versions come from package-lock.json via step outputs. Passed through
        # env, not `${{ }}` in the script, so a malformed version string can
        # never become shell syntax. (Audit 2026-11-26 follow-through.)
        env:
          OLD_VERSION: ${{ steps.current.outputs.version }}
          NEW_VERSION: ${{ steps.updated.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update @zaherkarp/skillsprout-client from ${OLD_VERSION} to ${NEW_VERSION}"
          git push
